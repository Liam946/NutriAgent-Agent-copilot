# 该文件用于: 管理整个项目的配置.

# MySQL 配置
# 注意：MySQL 默认端口是 3306，你之前说改成了 80，这里按 80 写。如果你的报错连不上，请改回 3306。
[mysql]
host = 127.0.0.1
port = 3306
user = root
password = 12345678
database = nutrition_db

# Redis 配置 (用于 FAQ 缓存和 Celery，当前你已用 Docker 启动)
[redis]
host = 127.0.0.1
port = 6379
password =
db = 0

# Milvus 配置
[milvus]
host = 127.0.0.1
port = 19530
collection_name = nutrition_docs

# LLM 配置 (使用你本地 Docker 跑的 SGLang)
[llm]
model = Qwen/Qwen3-0.6B
base_url = http://127.0.0.1:30000/v1

# 检索与切分参数配置
[retrieval]
# 父子分块参数（目前你的代码是单层分块，但可以先把参数写好，为后续优化做准备）
parent_chunk_size = 1200
child_chunk_size = 500
chunk_overlap = 50
# 召回数量（之前你改成了8，这里作为统一配置项）
retrieval_k = 8
candidate_m = 2

[logger]
log_file = logs/app.log